<div class="toast-container" aria-live="polite" aria-atomic="true">
  @for (toast of toasts(); track toast.id) {
    <div
      class="toast-item"
      [class.toast-info]="toast.type === 'info'"
      [class.toast-success]="toast.type === 'success'"
      [class.toast-warning]="toast.type === 'warning'"
      [class.toast-error]="toast.type === 'error'"
      role="alert"
    >
      <div class="toast-icon-wrapper">
        @switch (toast.type) {
          @case ('success') {
            <svg class="toast-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
          }
          @case ('warning') {
            <svg class="toast-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
              <line x1="12" y1="9" x2="12" y2="13"></line>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
          }
          @case ('error') {
            <svg class="toast-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="15" y1="9" x2="9" y2="15"></line>
              <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
          }
          @default {
            <svg class="toast-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
          }
        }
      </div>

      <div class="toast-content">
        <h4 class="toast-title">{{ toast.title }}</h4>
        @if (toast.message) {
          <p class="toast-message">{{ toast.message }}</p>
        }
      </div>

      <button
        type="button"
        class="toast-close-btn"
        (click)="dismiss(toast.id)"
        aria-label="Fermer la notification"
      >
        <svg class="toast-close-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  }
</div>
